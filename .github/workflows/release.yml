name: Coldpin Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing Git tag (e.g. v1.2.0) to publish release artifacts for; leave empty for dry-run verification'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Validate release tag matches package version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          PKG_VER="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          TARGET_TAG=""
          if [ "$EVENT_NAME" = "push" ]; then
            TARGET_TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TARGET_TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TARGET_TAG="$REF_NAME"
          fi
          if [ -n "$TARGET_TAG" ]; then
            if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.+-]+)?$ ]]; then
              echo "ERROR: Invalid release tag format '${TARGET_TAG}'." >&2
              exit 1
            fi
            if [ "$TARGET_TAG" != "v${PKG_VER}" ]; then
              echo "ERROR: Release tag '${TARGET_TAG}' does not match package.json version 'v${PKG_VER}'." >&2
              exit 1
            fi
          fi
          echo "RELEASE_TAG=${TARGET_TAG}" >> "$GITHUB_ENV"

      - name: Run full verification pipeline and build reproducible bundles
        run: npm run verify:all

      - name: Verify zero tracked-file or CRLF drift
        run: git diff --exit-code

      - name: Compute SHA-256 checksums for release artifacts
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            coldpin-antigravity.zip \
            coldpin-claude.zip \
            coldpin-openai.zip \
            skillspector-self-audit.sarif > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/coldpin-antigravity.zip \
            dist/coldpin-claude.zip \
            dist/coldpin-openai.zip \
            dist/skillspector-self-audit.sarif \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "Coldpin ${RELEASE_TAG}" \
            --generate-notes
